<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora Simples</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator" aria-label="Calculadora">
    <h1>Calculadora</h1>
    <p class="subtitle">Projeto de prática com Git e GitHub</p>
    <label for="display" class="sr-only">Visor da calculadora</label>
    <input id="display" value="0" readonly aria-live="polite">
    <div class="keys" id="keys">
      <button data-action="clear" class="utility">C</button>
      <button data-action="backspace" class="utility" aria-label="Apagar último dígito">⌫</button>
      <button data-value="/" class="operator">÷</button>
      <button data-value="*" class="operator">×</button>
      <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button data-value="-" class="operator">−</button>
      <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button data-value="+" class="operator">+</button>
      <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button data-action="equals" class="equals">=</button>
      <button data-value="0" class="zero">0</button><button data-value=".">.</button>
    </div>
    <p class="hint">Use os botões para calcular.</p>
  </main>
</body>
</html>
